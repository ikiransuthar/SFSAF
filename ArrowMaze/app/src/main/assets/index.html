<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrow Maze</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--card:#f4f6fa;--ink:#14161a;--mut:#5b6475;--line:#c9d0dd;--blue:#1f4fd8;--bad:#d92d20}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#eef2fa;--mut:#9aa7c0;--line:#33405c;--blue:#7a9dff;--bad:#ff7a6e}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#eef2fa;--mut:#9aa7c0;--line:#33405c;--blue:#7a9dff;--bad:#ff7a6e}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 15px 'Sora',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{box-sizing:border-box;max-width:480px;height:100%;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between}
.c{text-align:center;line-height:1.1}.c small{color:var(--mut);font-size:12px}.c b{font-size:28px;font-weight:800;display:block}
#hp{min-width:84px;display:flex;gap:3px;justify-content:flex-end}
.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;padding:0 4px}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#bd{width:min(100%,calc(100vh - 290px));aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:22px;touch-action:manipulation}
#bd circle{fill:var(--line)}
.h{fill:none;stroke:transparent;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
.ar{cursor:pointer}
polyline.v{fill:none;stroke:var(--c,var(--ink));stroke-width:.2;stroke-linecap:round;stroke-linejoin:round}
polygon.v{fill:var(--c,var(--ink));stroke:var(--c,var(--ink));stroke-width:.06;stroke-linejoin:round}
.hint{--c:var(--blue)}.bad{--c:var(--bad);animation:sh .15s 4}
@keyframes sh{50%{transform:translate(.1px,0)}}
.tip{margin:0;text-align:center;color:var(--mut);font-size:13px}
footer{display:flex;gap:10px}
button,input{font:700 15px 'Sora',system-ui,sans-serif}
.btn{min-height:48px;padding:0 18px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
footer .btn{flex:1}.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#ov{position:fixed;inset:0;background:rgba(10,14,24,.6);display:flex;align-items:center;justify-content:center;padding:20px}
#ov[hidden]{display:none}
.m{width:100%;max-width:340px;box-sizing:border-box;background:var(--bg);border-radius:24px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:14px}
.m h2{margin:0;font-size:24px;font-weight:800}.m p{margin:0;color:var(--mut)}
.st{display:flex;justify-content:center;gap:8px}
input{width:90px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
@media (prefers-reduced-motion:reduce){.bad{animation:none}}
#wl{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(120% 80% at 50% 0%,#24408f 0%,#0f1420 62%);color:#fff;transition:opacity .5s,visibility .5s}
#wl.out{opacity:0;visibility:hidden}
.wc{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px}
.wc>*{opacity:0;transform:translateY(14px);animation:up .7s forwards}
@keyframes up{to{opacity:1;transform:none}}
.wi{width:84px;height:84px;margin-bottom:14px;box-shadow:0 12px 40px rgba(31,79,216,.55);border-radius:22px}
.wk{margin:0;font-size:13px;letter-spacing:.3em;color:#9db4f0}
.w1{margin:12px 0 0;font-size:38px;font-weight:800}
.w2{margin:0;font-size:17px;color:#c5d1ee}
.wr{width:56px;height:3px;border-radius:2px;background:#7a9dff;margin:14px 0 6px}
.wn{margin:0;font-size:14px;font-weight:500;letter-spacing:.1em;color:#9db4f0}
@media (prefers-reduced-motion:reduce){.wc>*{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
<header><button class="btn" id="menu">Menu</button><div class="c"><small>Level</small><b id="lv">1</b></div><div id="hp"></div></header>
<div class="bar"><span id="left"></span><span id="mv"></span></div>
<main><svg id="bd" role="group" aria-label="Arrow board"></svg></main>
<p class="tip">Tap an arrow to slide it out. A blocked arrow costs a life.</p>
<footer><button class="btn" id="un">Undo</button><button class="btn" id="rs">Restart</button><button class="btn pri" id="ht">Hint</button></footer>
</div>
<div id="ov" hidden></div>
<div id="wl"><div class="wc">
<svg class="wi" viewBox="0 0 84 84" aria-hidden="true"><rect width="84" height="84" rx="22" fill="#1f4fd8"/><path d="M22 56V36h30" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 24l16 12-16 12z" fill="#fff"/></svg>
<h1 class="w1" style="animation-delay:.25s">Arrow Maze</h1>
<p class="wn" style="animation-delay:.5s">by ikiransuthar</p>
</div></div>
<script>
const $=id=>document.getElementById(id),MAX=100000,D=[[0,-1],[1,0],[0,1],[-1,0]];
let L,S,mv,lives,hist,B=1,lock=0,ht,AC,muted=0;
try{muted=localStorage.getItem('amsound')==='0'}catch(e){}
function tone(f,s,d,ty,v,e){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+s;o.type=ty;o.frequency.setValueAtTime(f,t);if(e)o.frequency.exponentialRampToValueAtTime(e,t+d);g.gain.setValueAtTime(Math.min(1,v*2.5),t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
['pointerdown','touchstart','click'].forEach(ev=>document.addEventListener(ev,()=>{if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!='running')AC.resume()}catch(e){}},{passive:true}));
function snd(k){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
if(k=='slide'){tone(260,0,.4,'sine',.2,1100);tone(180,0,.3,'triangle',.08,700)}
else if(k=='bump'){tone(150,0,.2,'square',.12,60)}
else if(k=='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.35,'triangle',.22))}
else if(k=='fail'){[392,330,262].forEach((f,i)=>tone(f,i*.2,.35,'sawtooth',.1))}
else if(k=='tap'){tone(700,0,.07,'sine',.12)}
else if(k=='hint'){tone(880,0,.12,'sine',.15);tone(1175,.1,.18,'sine',.15)}}catch(e){}}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Difficulty: bigger grid, denser board, more complex shapes as the level rises.
function cfg(l){const n=Math.min(16,7+Math.floor(Math.sqrt(l-1)/1.2));return{n,goal:Math.floor(n*n*Math.min(.88,.5+l/3000+n*.01)),m:Math.min(6,2+Math.floor(l/40))}}
// Shape templates as [turn, length] segments: straight, L, Z/S, U, stairs, zigzag, spiral, snake.
const Tm={
s:(q,m)=>[[0,q(m)+1]],
l:(q,m)=>[[0,q(m)],[1,q(m)]],
z:(q,m)=>[[0,q(m)],[1,q(m)],[-1,q(m)]],
u:(q,m)=>[[0,q(m)],[1,q(2)],[1,q(m)]],
t:(q,m)=>{const a=[[0,1],[1,1]];for(let k=q(3);k>0;k--)a.push([-1,1],[1,1]);return a},
g:(q,m)=>[[0,q(m)],[1,q(m)],[-1,q(m)],[1,q(m)]],
p:(q,m)=>[[0,q(m)+1],[1,q(m)+1],[1,q(m)],[1,q(m)]],
k:(q,m)=>{const a=[[0,q(m)]];for(let i=2+q(3);i>0;i--)a.push([q(2)==1?1:-1,q(m)]);return a}};
function pool(l){return l>=20?['l','z','u','t','g','p','k','k']:l>=8?['s','l','z','u','t','g']:l>=3?['s','l','l','z','u']:['s','l','l']}
// Each arrow is placed with a clear exit ray, so removing arrows in reverse order always solves the level.
function gen(l){const{n,goal,m}=cfg(l),r=rng(l*7919+13),q=k=>1+(r()*k|0),pl=pool(l),g=Array(n*n).fill(-1),A=[];let cells=0,tries=0;
while((cells<goal||!A.length)&&tries++<12000){let x=r()*n|0,y=r()*n|0;if(g[y*n+x]>=0)continue;
const tp=Tm[pl[r()*pl.length|0]](q,m),mir=r()<.5?-1:1,P=[[x,y]],seen=new Set([y*n+x]);let d=r()*4|0,ld=d,ok=1;
out:for(const[tu,ln]of tp){d=(d+tu*mir+8)%4;for(let k=0;k<ln;k++){const a=x+D[d][0],b=y+D[d][1];if(a<0||b<0||a>=n||b>=n||g[b*n+a]>=0||seen.has(b*n+a)){ok=0;break out}x=a;y=b;P.push([x,y]);seen.add(y*n+x);ld=d}}
if(P.length<2||(!ok&&tries<7000))continue;
let rx=x+D[ld][0],ry=y+D[ld][1],f=1;while(rx>=0&&ry>=0&&rx<n&&ry<n){if(g[ry*n+rx]>=0||seen.has(ry*n+rx)){f=0;break}rx+=D[ld][0];ry+=D[ld][1]}
if(!f)continue;P.forEach(([p,q])=>g[q*n+p]=A.length);A.push({P,d:ld,on:1});cells+=P.length}
return{n,A,g}}
function canMove(i){const a=S.A[i];let[x,y]=a.P[a.P.length-1];const[dx,dy]=D[a.d],n=S.n;x+=dx;y+=dy;
while(x>=0&&y>=0&&x<n&&y<n){if(S.g[y*n+x]>=0)return false;x+=dx;y+=dy}return true}
function save(){B=Math.max(B,L);try{localStorage.setItem('arrowmaze',JSON.stringify({l:L,b:B}))}catch(e){}}
function start(l){L=Math.max(1,Math.min(MAX,l|0||1));S=gen(L);mv=0;lives=3;hist=[];lock=0;$('ov').hidden=1;draw();hud();save()}
const hd=(cx,cy,ux,uy)=>{const f=(u,v)=>(cx+ux*u-uy*v).toFixed(2)+','+(cy+uy*u+ux*v).toFixed(2);return f(.48,0)+' '+f(.04,.27)+' '+f(.04,-.27)};
function shp(a){const[x,y]=a.P[a.P.length-1],[dx,dy]=D[a.d];return[a.P.map(([x,y])=>(x+.5)+','+(y+.5)).join(' '),hd(x+.5,y+.5,dx,dy)]}
function draw(){const n=S.n;let h='';
for(let y=0;y<n;y++)for(let x=0;x<n;x++)h+=`<circle cx="${x+.5}" cy="${y+.5}" r=".05"/>`;
S.A.forEach((a,i)=>{const[pts,hp]=shp(a);
h+=`<g class="ar" id="a${i}" data-i="${i}"><polyline class="h" points="${pts}"/><polyline class="v" points="${pts}"/><polygon class="v" points="${hp}"/></g>`});
$('bd').setAttribute('viewBox',`0 0 ${n} ${n}`);$('bd').innerHTML=h}
// The arrow slides along its own shape like a snake: bends straighten out, then it exits along its head direction.
function glide(i){const a=S.A[i],g=$('a'+i),[dx,dy]=D[a.d],pts=a.P.map(([x,y])=>[x+.5,y+.5]),nb=pts.length-1,cum=[0];
for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+Math.abs(pts[k][0]-pts[k-1][0])+Math.abs(pts[k][1]-pts[k-1][1]));
const body=cum[nb],ext=S.n+body+3,e=pts[nb];pts.push([e[0]+dx*ext,e[1]+dy*ext]);cum.push(body+ext);
const at=s=>{let k=1;while(k<cum.length-1&&cum[k]<s)k++;const t=(s-cum[k-1])/(cum[k]-cum[k-1]||1);return[pts[k-1][0]+(pts[k][0]-pts[k-1][0])*t,pts[k-1][1]+(pts[k][1]-pts[k-1][1])*t,k]};
const smax=body+S.n+2,dur=Math.max(380,Math.min(1000,smax*55)),t0=performance.now(),vs=g.querySelectorAll('.v');g.querySelector('.h').style.display='none';
const step=now=>{if(!g.isConnected)return;const t=Math.min(1,(now-t0)/dur),s=smax*t*t,A0=at(s),B=at(s+body),w=[[A0[0],A0[1]]];
for(let k=A0[2];k<B[2];k++)w.push(pts[k]);w.push([B[0],B[1]]);
vs[0].setAttribute('points',w.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' '));
const k=B[2];vs[1].setAttribute('points',hd(B[0],B[1],Math.sign(pts[k][0]-pts[k-1][0]),Math.sign(pts[k][1]-pts[k-1][1])));
if(t<1)a.raf=requestAnimationFrame(step);else g.style.display='none'};
a.raf=requestAnimationFrame(step);return dur}
function hud(){$('lv').textContent=L.toLocaleString();$('mv').textContent='Moves '+mv;
$('left').textContent='Arrows left '+S.A.filter(a=>a.on).length;
$('hp').innerHTML=[0,1,2].map(i=>`<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill:${i<lives?'var(--bad)':'none'};stroke:var(--bad);stroke-width:2"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 018-2.7A4.5 4.5 0 0120 10c0 5.7-8 11-8 11z"/></svg>`).join('');
$('hp').setAttribute('aria-label',lives+' lives left')}
function show(h){$('ov').innerHTML='<div class="m">'+h+'</div>';$('ov').hidden=0}
const star=on=>`<svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15,9 22,9.3 16.5,14 18.5,21 12,17 5.5,21 7.5,14 2,9.3 9,9" style="fill:${on?'#f5a524':'none'};stroke:#f5a524;stroke-width:1.5;stroke-linejoin:round"/></svg>`;
function win(){snd('win');B=Math.max(B,Math.min(MAX,L+1));save();
show(`<h2>Level ${L.toLocaleString()} cleared</h2><div class="st" aria-label="${lives} of 3 stars">${[1,2,3].map(i=>star(i<=lives)).join('')}</div><p>${mv} moves</p>`+(L<MAX?'<button class="btn pri" data-a="n">Next level</button>':'<p>You cleared all 100,000 levels!</p>'))}
function fail(){snd('fail');show('<h2>Out of lives</h2><p>Look for arrows with a clear path first.</p><button class="btn pri" data-a="r">Try again</button>')}
$('bd').addEventListener('click',e=>{const g=e.target.closest('.ar');if(!g||lock)return;const i=+g.dataset.i,a=S.A[i];if(!a.on)return;
if(canMove(i)){snd('slide');a.on=0;a.P.forEach(([x,y])=>S.g[y*S.n+x]=-1);hist.push(i);mv++;const dur=glide(i);hud();
if(!S.A.some(a=>a.on)){lock=1;setTimeout(win,dur+250)}}
else{snd('bump');g.classList.remove('bad');void g.getBoundingClientRect();g.classList.add('bad');setTimeout(()=>g.classList.remove('bad'),700);
lives--;hud();if(lives<=0){lock=1;setTimeout(fail,600)}}});
$('un').onclick=()=>{snd('tap');if(lock||!hist.length)return;const i=hist.pop(),a=S.A[i],g=$('a'+i);cancelAnimationFrame(a.raf);a.on=1;a.P.forEach(([x,y])=>S.g[y*S.n+x]=i);
const sh=shp(a),vs=g.querySelectorAll('.v');vs[0].setAttribute('points',sh[0]);vs[1].setAttribute('points',sh[1]);g.querySelector('.h').style.display='';g.style.display='';mv--;hud()};
$('rs').onclick=()=>{snd('tap');start(L)};
$('ht').onclick=()=>{if(lock)return;const i=S.A.findIndex((a,k)=>a.on&&canMove(k));if(i<0)return;snd('hint');const g=$('a'+i);g.classList.add('hint');clearTimeout(ht);ht=setTimeout(()=>g.classList.remove('hint'),1600)};
$('menu').onclick=()=>{snd('tap');show(`<h2>Menu</h2><p>Current level: ${L.toLocaleString()}</p><p>Highest level reached: ${B.toLocaleString()} of 100,000</p><button class="btn pri" data-a="s">Sound: ${muted?'Off':'On'}</button><button class="btn pri" data-a="x">Resume</button>`)};
$('ov').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;if(a!='s')snd('tap');
if(a=='n')start(L+1);else if(a=='r')start(L);else if(a=='x')$('ov').hidden=1;else if(a=='s'){muted=!muted;try{localStorage.setItem('amsound',muted?'0':'1')}catch(e){}e.target.textContent='Sound: '+(muted?'Off':'On');snd('tap')}});
try{const s=JSON.parse(localStorage.getItem('arrowmaze')||'{}');B=Math.min(MAX,s.b||1);L=s.l||1}catch(e){L=1}
start(L);
const hs=()=>{$('wl').classList.add('out');setTimeout(()=>$('wl')&&$('wl').remove(),600)};$('wl').onclick=hs;setTimeout(hs,2400);
</script>
</body>
</html>
